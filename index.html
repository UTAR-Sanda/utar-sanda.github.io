<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="UTAR 武术散打队新人基础训练手册：规则、步法、拳法、腿法、摔法、体能与专项。">
<title>UTAR 散打基础训练手册</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a training-log ledger — tally strip on top, filter rails, then one card per technique like an index card in a coach's box; cards with motion open an inline animated diagram */
:root{
  --bg:#f5f3f0; --surface:#ffffff; --ink:#1c1a1a; --muted:#6b6461; --line:#e2ddd8;
  --accent:#b3261e; --accent-soft:#f6e3e1; --blue:#2453a6; --stage:#faf8f6;
  --a:#1f7a52; --a-soft:#e1f1e8; --b:#a56a00; --b-soft:#f8ecd3; --c:#8a8380; --c-soft:#ece9e6;
  --f-display:"Noto Serif SC","Songti SC",serif;
  --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141212; --surface:#1d1a1a; --ink:#efebe8; --muted:#a39b97; --line:#332e2d;
  --accent:#e2574d; --accent-soft:#3a1d1b; --blue:#6f9cf0; --stage:#171515;
  --a:#5cc792; --a-soft:#173326; --b:#e0a83a; --b-soft:#3a2c12; --c:#a39b97; --c-soft:#2a2625; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141212; --surface:#1d1a1a; --ink:#efebe8; --muted:#a39b97; --line:#332e2d;
  --accent:#e2574d; --accent-soft:#3a1d1b; --blue:#6f9cf0; --stage:#171515;
  --a:#5cc792; --a-soft:#173326; --b:#e0a83a; --b-soft:#3a2c12; --c:#a39b97; --c-soft:#2a2625; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
header{display:flex;flex-direction:column;gap:6px;border-bottom:3px solid var(--accent);padding-bottom:14px}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--accent);font-weight:700}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,7vw,40px);line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:60ch}
.tally{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tally div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column}
.tally b{font-family:var(--f-mono);font-size:22px;font-variant-numeric:tabular-nums}
.tally span{font-size:12px;color:var(--muted)}
.tally .ta b{color:var(--a)} .tally .tb b{color:var(--b)} .tally .tc b{color:var(--c)}
.filters{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row label{font-size:12px;color:var(--muted);width:3.5em;flex:none}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;min-width:0}
.grade{grid-row:span 3;width:40px;height:40px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:22px}
.g训{background:var(--accent-soft);color:var(--accent)}
.gA{background:var(--a-soft);color:var(--a)} .gB{background:var(--b-soft);color:var(--b)} .gC{background:var(--c-soft);color:var(--c)}
.title{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;min-width:0}
.num{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.title h2{font-family:var(--f-display);font-size:18px;margin:0;font-weight:700}
.en{font-size:13px;color:var(--muted)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{font-size:12px;padding:1px 8px;border-radius:4px;background:var(--bg);color:var(--muted)}
.tag.src{background:var(--accent-soft);color:var(--accent)}
.btn{font:inherit;font-size:12px;font-weight:700;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:4px;padding:1px 10px;cursor:pointer}
.btn[aria-expanded="true"],.btn.on{background:var(--accent);color:var(--surface)}
.body{grid-column:2;display:flex;flex-direction:column;gap:6px;min-width:0}
.body p{margin:0}
.body .k{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.06em;margin-right:6px}
.motion{grid-column:1/-1;margin-top:8px;border:1px solid var(--line);border-radius:8px;background:var(--stage);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.motion svg{width:100%;height:auto;display:block;max-height:300px}
.mbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.step{font-family:var(--f-display);font-weight:700;font-size:15px;flex:1;min-width:10em}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps .chip{font-size:12px;padding:2px 10px}
.legend{font-size:12px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.vids{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.vids a{color:var(--accent);font-size:13px;font-weight:500;text-underline-offset:3px;overflow-wrap:anywhere}
.vids a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.modes{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.chapters{display:flex;gap:8px;flex-wrap:wrap}
.chapters .chip{font-size:14px;padding:6px 14px}
.chhead{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.chhead h2{font-family:var(--f-display);font-size:22px;margin:0}
.chhead p{margin:0;color:var(--muted)}
.gate{font-size:14px}
.gate b{color:var(--accent)}
.ord{grid-row:span 3;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:18px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.ord.core{background:var(--accent);color:var(--surface);border-color:var(--accent)}
.tag.core{background:var(--accent);color:var(--surface);font-weight:700}
.body ol,.body ul{margin:2px 0 0;padding-left:1.4em;display:flex;flex-direction:column;gap:2px}
.std{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:2px}
.std div{background:var(--bg);border-radius:6px;padding:8px 10px;font-size:13px;min-width:0}
.std b{display:block;font-size:12px;color:var(--accent);letter-spacing:.06em}
.pre{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
@media (max-width:480px){.std{grid-template-columns:1fr}.ord{grid-row:auto;width:34px;height:34px;font-size:16px}}
.lvnav{display:flex;gap:8px;flex-wrap:wrap}
.lvnav .chip{font-size:14px;padding:6px 14px}
.fsec{font-family:var(--f-display);font-size:20px;margin:10px 0 0;padding-bottom:4px;border-bottom:2px solid var(--line)}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.fcard h3{font-family:var(--f-display);font-size:18px;margin:0}
.fcard .why{margin:0;padding-left:1.2em;color:var(--muted);font-size:14px;display:flex;flex-direction:column;gap:2px}
.tbl{overflow-x:auto;max-width:100%}
.tbl table{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.04em;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:none}
.tbl td:first-child{font-weight:700;min-width:5.5em}
.tbl td.dose{white-space:nowrap;font-variant-numeric:tabular-nums}
.lvhead{background:var(--ink);color:var(--bg);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.lvhead h2{font-family:var(--f-display);font-size:22px;margin:0}
.lvhead p{margin:0;opacity:.85}
.fcard.std{border-left:4px solid var(--accent)}
.exl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ex{border-bottom:1px solid var(--line)}
.ex:last-child{border-bottom:none}
.ex summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:10px 12px;align-items:baseline}
.ex summary::-webkit-details-marker{display:none}
.ex summary::before{content:"＋";grid-row:span 2;color:var(--accent);font-weight:700;margin-right:2px;display:none}
.ex .exn{min-width:0}
.ex .exn b::before{content:"▸ ";color:var(--accent)}
.ex[open] .exn b::before{content:"▾ "}
.ex .dose{font-variant-numeric:tabular-nums;font-size:14px;white-space:nowrap;text-align:right}
.ex .tipline{grid-column:1/-1;font-size:13px;color:var(--muted)}
.ex[open] .tipline{display:none}
.ex summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.ex[open]{background:var(--bg)}
.ex>p.tip{margin:0 12px 4px;font-size:13px;color:var(--accent);font-weight:700}
.ex ol{margin:0 12px 8px;padding-left:1.4em;display:flex;flex-direction:column;gap:2px;font-size:14px}
.ex .vlink{display:inline-block;margin:0 12px 12px;color:var(--accent);font-weight:700;font-size:14px;text-underline-offset:3px}
@media (max-width:480px){.tbl td.dose{white-space:normal}}
.empty,.note{color:var(--muted);text-align:center;padding:32px 12px;border:1px dashed var(--line);border-radius:10px}
@media (max-width:480px){.tally{grid-template-columns:repeat(2,1fr)}.card{grid-template-columns:1fr}.grade{grid-row:auto;width:34px;height:34px;font-size:18px}.body{grid-column:1}}
@media (prefers-reduced-motion:reduce){.motion{scroll-behavior:auto}}
.foot{max-width:860px;margin:0 auto;padding:0 16px 32px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">UTAR 散打基础 MANUAL</div>
    <h1 id="h1">散打技术库</h1>
    <div class="modes" style="display:none" role="group" aria-label="视图">
      <button class="chip" type="button" id="mode-manual">手册（新人）</button>
      <button class="chip" type="button" id="mode-coach">教练（素材库）</button>
    </div>
    <p class="sub" id="subCoach" hidden>从 Boxing、MMA、BJJ 里练过的动作，按散打规则重新评级。A 直接能用，B 需要改，C 不适用；标"训"的是体能和专项训练方法。每条附示范视频链接，点开会在新页面播放。</p>
  </header>

  <p class="sub" id="subManual">按章节一步步练：站架、步法、拳法、腿法、摔法。每章标「关卡」的核心动作全部达到「会用」，才进入下一章；其他动作可以边学下一章边补。体能与专项训练全程同步进行。</p>
  <nav class="chapters" id="chapters" aria-label="章节"></nav>
  <div id="coachUI" hidden>
  <section class="tally" aria-label="评级统计">
    <div><b id="tAll">–</b><span>全部</span></div>
    <div class="ta"><b id="tA">–</b><span>A 直接用</span></div>
    <div class="tb"><b id="tB">–</b><span>B 需要改</span></div>
    <div class="tc"><b id="tC">–</b><span>C 不适用</span></div>
  </section>

  <section class="filters" aria-label="筛选">
    <div class="row" id="fCat"><label>类别</label></div>
    <div class="row" id="fRate"><label>评级</label></div>
    <div class="row" id="fSrc"><label>来源</label></div>
    <div class="count" id="count"></div>
  </section>
  </div>

  <section class="list" id="list">
    <div class="note" id="status">正在载入手册…</div>
  </section>
</div>

<footer class="foot" id="foot"></footer>
<script>
const CATS=["全部","脚步","拳法","腿法","摔法","防守","组合","体能","专项"];
const RATES=["全部","A","B","C"];
const SRCS=["全部","Boxing","MMA","BJJ","网上","建议"];
const state={cat:"全部",rate:"全部",src:"全部",open:null,mode:"manual",ch:7,lv:1};
let levels={};
try{const l=parseInt(localStorage.getItem("lv"),10);if(l>=1&&l<=3)state.lv=l;}catch(e){}
try{const c=parseInt(localStorage.getItem("ch"),10);if(c>=0&&c<=9)state.ch=c;}catch(e){}
const CHAPTERS=[
 {name:"第 0 章　站架",short:"0 站架",intro:"所有动作的起点。站架不稳，后面每一章都会出问题。"},
 {name:"第 1 章　步法",short:"1 步法",intro:"先学会移动，再学打。步法贯穿之后所有章节，学拳腿摔时也要一直练。"},
 {name:"第 2 章　拳法",short:"2 拳法",intro:"先单拳、再组合，同时学基本防守。散打里拳得 1 分，主要用来控制距离和给腿法、摔法开路。"},
 {name:"第 3 章　腿法",short:"3 腿法",intro:"所有腿法从提膝开始。散打里腿慢会被接腿摔，所以收腿和出腿一样重要。"},
 {name:"第 4 章　摔法",short:"4 摔法",intro:"先学入步和防摔，再学摔。散打摔法膝盖不着地，抱住后 2 秒内要摔成，自己要保持站立才得 2 分。"},
 {name:"体能与专项",short:"体能与专项",intro:"和技术章节同时进行。先选你现在的级别，下面只显示这一级要练的内容和晋级标准。"},
 {name:"进阶拳法　组合拳",short:"2+ 进阶拳法",intro:"拳法章的关卡过了再学，可以和腿法、摔法同时练。拳号：1 Jab、2 Cross、3 前手 Hook、4 后手 Hook、5 前手 Uppercut、6 后手 Uppercut。散打里组合打完要接结尾：低扫、出角或防摔准备，不要停在近距离。"},
 {name:"比赛规则",short:"规则",intro:"先懂规则，才知道为什么散打的动作要这样改。这里是新人需要知道的部分，按 IWUF 2024 规则整理。"},
 {name:"术语表",short:"术语",intro:"手册里中英文混用，看不懂的词在这里查。"},
 {name:"一堂课流程",short:"一堂课",intro:"一堂训练课按什么顺序、每段多久、做什么。教练备课和新人了解训练都看这里。"}];
function setMode(m){state.mode=m;try{localStorage.setItem("mode",m);}catch(e){}render();}
document.getElementById("mode-manual").addEventListener("click",()=>setMode("manual"));
document.getElementById("mode-coach").addEventListener("click",()=>setMode("coach"));
function buildChapters(){const nav=document.getElementById("chapters");nav.replaceChildren();
  [7,9,0,1,2,6,3,4,5,8].forEach(i=>{const c=CHAPTERS[i];const b=el("button","chip",c.short);b.type="button";b.id="ch-"+i;b.setAttribute("aria-pressed",String(state.ch===i));
    b.addEventListener("click",()=>{state.ch=i;state.open=null;try{localStorage.setItem("ch",String(i));}catch(e){}render();});nav.appendChild(b);});}
let rows=[];

function chips(id,opts,key){
  const box=document.getElementById(id);
  opts.forEach(o=>{
    const b=document.createElement("button");
    b.className="chip";b.type="button";b.textContent=o;b.id=id+"-"+o;
    b.setAttribute("aria-pressed",String(state[key]===o));
    b.addEventListener("click",()=>{state[key]=o;
      box.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",String(c.textContent===o)));
      render();});
    box.appendChild(b);
  });
}
chips("fCat",CATS,"cat");chips("fRate",RATES,"rate");chips("fSrc",SRCS,"src");

function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}

/* ---------- motion engine ---------- */
const NS="http://www.w3.org/2000/svg";
function sv(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
function mix(a,b,t){
  if(typeof a==="number")return a+(b-a)*t;
  if(Array.isArray(a))return a.map((v,i)=>mix(v,b[i],t));
  if(a&&typeof a==="object"){const o={};for(const k in a)o[k]=(b&&k in b)?mix(a[k],b[k],t):a[k];return o;}
  return a;
}
function sample(keys,time){
  let i=0;while(i<keys.length-1&&keys[i+1].t<=time)i++;
  const k=keys[i],n=keys[i+1];
  if(!n)return{f:k,label:k.label,idx:i};
  const t=ease((time-k.t)/(n.t-k.t));
  return{f:mix(k,n,t),label:n.label,idx:i+1};
}
const RAD=Math.PI/180;
/* side view, y up. angles: 0 = straight down, + = toward facing direction */
function figure(p,dir){
  const v=(ang,len)=>[dir*Math.sin(ang*RAD)*len,-Math.cos(ang*RAD)*len];
  const add=(a,b)=>[a[0]+b[0],a[1]+b[1]];
  const hip=[p.x,0];
  const tv=[dir*Math.sin((p.torso||0)*RAD),Math.cos((p.torso||0)*RAD)];
  const neck=[hip[0]+tv[0]*50,hip[1]+tv[1]*50];
  const sh=[hip[0]+tv[0]*45,hip[1]+tv[1]*45];
  const head=[hip[0]+tv[0]*62,hip[1]+tv[1]*62];
  const leg=(th,sh_)=>{const k=add(hip,v(th,40));return[k,add(k,v(th+sh_,40))];};
  const arm=(ua,fa)=>{const e=add(sh,v((p.torso||0)+ua,27));return[e,add(e,v((p.torso||0)+ua+fa,25))];};
  const fl=leg(p.ft,p.fs),bl=leg(p.bt,p.bs),fa=arm(p.fua,p.ffa),ba=arm(p.bua,p.bfa);
  const pts=[fl[0],fl[1],bl[0],bl[1]];
  const lift=p.air?0:-Math.min(...pts.map(q=>q[1]));
  const L=q=>[q[0],q[1]+lift];
  return{hip:L(hip),neck:L(neck),sh:L(sh),head:L(head),fl:fl.map(L),bl:bl.map(L),fa:fa.map(L),ba:ba.map(L)};
}
const GY=150,toS=q=>[q[0],GY-q[1]];
function drawFigure(g,f,color,ghost){
  const op=ghost?.35:1;
  const line=(a,b,w,o)=>{const A=toS(a),B=toS(b);sv("line",{x1:A[0],y1:A[1],x2:B[0],y2:B[1],stroke:color,"stroke-width":w,"stroke-linecap":"round","stroke-opacity":o*op},g);};
  const limb=(root,seg,o)=>{line(root,seg[0],6,o);line(seg[0],seg[1],5.5,o);};
  limb(f.sh,f.ba,.45);limb(f.hip,f.bl,.45);
  line(f.hip,f.neck,7,1);
  const H=toS(f.head);sv("circle",{cx:H[0],cy:H[1],r:9.5,fill:color,"fill-opacity":op},g);
  limb(f.hip,f.fl,1);limb(f.sh,f.fa,1);
}
function drawSide(svg,frame){
  svg.replaceChildren();
  svg.setAttribute("viewBox","-110 -5 300 168");
  sv("line",{x1:-110,y1:GY,x2:190,y2:GY,stroke:"var(--line)","stroke-width":2},svg);
  for(let x=-100;x<=180;x+=20)sv("line",{x1:x,y1:GY,x2:x-6,y2:GY+6,stroke:"var(--line)","stroke-width":1},svg);
  const g=sv("g",{},svg);
  if(frame.b)drawFigure(g,figure(frame.b,-1),"var(--blue)",true);
  if(frame.a)drawFigure(g,figure(frame.a,1),"var(--accent)",false);
}
function foot(g,f,color,front,txt){
